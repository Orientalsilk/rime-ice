# Rime schema settings
# encoding: utf-8
#
# 复制自 radical_pinyin.schema.yaml，供 double_pinyin_mspy（微软双拼）使用。
# radical_pinyin.schema.yaml 的 speller/algebra 一次只能生效一套派生规则，
# 全拼和双拼不通用，所以拆分出这一份专供双拼使用（algebra_double_pinyin_mspy），
# rime_ice（全拼）则继续使用 radical_pinyin.schema.yaml（algebra_rime_ice）。
# 实测这份重复编译的固定成本约等于 radical_pinyin 自身编译一次的耗时。

schema:
  schema_id: radical_mspy
  name: "部件拆字 | 微软双拼"
  version: "3.0.0"
  author: Mirtle
  description: |
    用拼音按顺序打出偏旁部件，组合出汉字（微软双拼专用副本）
    码表：开放词典 / henrysting / Mirtle
    注音、校对、方案：Mirtle
    仓库：https://github.com/mirtlecn/rime_radical_pinyin

engine:
  processors:
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - echo_translator
    - table_translator
  filters:
    - uniquifier

key_binder:
  __include: default:/key_binder?

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  delimiter: " '"
  algebra:
    __include: algebra_double_pinyin_mspy              # 微软双拼（硬编码，不再需要 custom.yaml 打补丁）

translator:
  dictionary: radical_pinyin
  enable_user_dict: false
  enable_completion: false
  enable_sentence: false

algebra_double_pinyin_mspy:
  - derive/^([jqxy])u(?=^|$|')/$1v/
  - derive/'([jqxy])u(?=^|$|')/'$1v/
  - derive/^([aoe].*)(?=^|$|')/o$1/
  - derive/'([aoe].*)(?=^|$|')/'o$1/
  - xform/^([ae])(.*)(?=^|$|')/$1$1$2/
  - xform/'([ae])(.*)(?=^|$|')/'$1$1$2/
  - xform/iu(?=^|$|')/<q>/
  - xform/[iu]a(?=^|$|')/<w>/
  - xform/er(?=^|$|')|[uv]an(?=^|$|')/<r>/
  - xform/[uv]e(?=^|$|')/<t>/
  - xform/uai(?=^|$|')/<y>/
  - xform/^sh/<u>/
  - xform/^ch/<i>/
  - xform/^zh/<v>/
  - xform/'sh/'<u>/
  - xform/'ch/'<i>/
  - xform/'zh/'<v>/
  - xform/uo(?=^|$|')/<o>/
  - xform/[uv]n(?=^|$|')/<p>/
  - xform/([a-z>])i?ong(?=^|$|')/$1<s>/
  - xform/[iu]ang(?=^|$|')/<d>/
  - xform/([a-z>])en(?=^|$|')/$1<f>/
  - xform/([a-z>])eng(?=^|$|')/$1<g>/
  - xform/([a-z>])ang(?=^|$|')/$1<h>/
  - xform/ian(?=^|$|')/<m>/
  - xform/([a-z>])an(?=^|$|')/$1<j>/
  - xform/iao(?=^|$|')/<c>/
  - xform/([a-z>])ao(?=^|$|')/$1<k>/
  - xform/([a-z>])ai(?=^|$|')/$1<l>/
  - xform/([a-z>])ei(?=^|$|')/$1<z>/
  - xform/ie(?=^|$|')/<x>/
  - xform/ui(?=^|$|')/<v>/
  - derive/<v>(?=^|$|')/<v>/
  - xform/([a-z>])ou(?=^|$|')/$1<b>/
  - xform/in(?=^|$|')/<n>/
  - xform/ing(?=^|$|')/<;>/
  - xform/'|<|>//
