patch:
  __include: grammar:/hans
  # ==========================================
  # 1. 基础个性化行为 (保持不变)
  # ==========================================
  "menu/page_size": 9
  "speller/auto_select": false
  "speller/alphabet": "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA;`"
  "speller/initials": "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA"

  # ==========================================
  # 2. 依赖引入：同时引入拆字与笔画词典
  # ==========================================
  "schema/dependencies/+":
    - stroke


  # 3. 核心：全量重写 filters，优化执行顺序
  # ==========================================
  "engine/filters":
    - lua_filter@*corrector                         # 1. 错音错字提示最先执行
    - reverse_lookup_filter@radical_reverse_lookup  # 2. 拆字反查滤镜
    - lua_filter@*autocap_filter                    # 3. 英文自动大写
    - lua_filter@*pin_cand_filter                   # 4. 置顶候选项
    - lua_filter@*long_word_filter                  # 5. 长词优先（新增：放在各种转换之前，保证长词权重计算准确）
    - lua_filter@*reduce_english_filter             # 6. 降低英文权重
    - simplifier@emoji                              # 7. Emoji 转换
    - simplifier@traditionalize                     # 8. 简繁转换
    - lua_filter@*search                          # 9. 辅助码筛选（替换了原有的，并统一交由 search 节点配置）
    - uniquifier                                    # 10. 最后去重收尾
  # ==========================================
  # 4. 配置 search.lua (拆字 + 笔画统一合并)
  # ==========================================
  search:
    schema: radical_pinyin  # 使用拆字方案作为主要的编码算法
    db:
      - stroke             # 同时挂载五笔画数据库，实现“一键双查”
    show_other_cands: false # 过滤不匹配项，保证候选纯净
    # 如果你开启了单字优先模式，可以取消下行的注释
    # switch:
    #   - name: search_single_char 

  # 配置 ` 键作为辅助码引导键
  key_binder/search: "`" 


  # ==========================================
  # 5. 雾凇拼音长词优先参数 (保持不变)
  # ==========================================
  long_word_filter:
    count: 10
    idx: 1

  # ==========================================
  # 7. 双拼代数规则 (保持不变)
  # ==========================================
  "speller/algebra":
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe].*)$/o$1/
    - derive/^([ae])(.*)$/$1$1$2/
    - derive/iu$/Ⓠ/
    - derive/[iu]a$/Ⓦ/
    - derive/er$|[uv]an$/Ⓡ/
    - derive/[uv]e$/Ⓣ/
    - derive/v$|uai$/Ⓨ/
    - derive/^sh/Ⓤ/
    - derive/^ch/Ⓘ/
    - derive/^zh/Ⓥ/
    - derive/uo$/Ⓞ/
    - derive/[uv]n$/Ⓟ/
    - derive/(.)i?ong$/$1Ⓢ/
    - derive/[iu]ang$/Ⓓ/
    - derive/(.)en$/$1Ⓕ/
    - derive/(.)eng$/$1Ⓖ/
    - derive/(.)ang$/$1Ⓗ/
    - derive/ian$/Ⓜ/
    - derive/(.)an$/$1Ⓙ/
    - derive/iao$/Ⓒ/
    - derive/(.)ao$/$1Ⓚ/
    - derive/(.)ai$/$1Ⓛ/
    - derive/(.)ei$/$1Ⓩ/
    - derive/ie$/Ⓧ/
    - derive/ui$/Ⓥ/
    - derive/Ⓣ$/Ⓥ/
    - derive/(.)ou$/$1Ⓑ/
    - derive/in$/Ⓝ/
    - derive/ing$/;/
    - xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⓂⒿⒸⓀⓁⓏⓍⓋⒷⓃ/qwrtyuiopsdfghmjcklzxvbn/