# Rime schema
# encoding: utf-8
#
# 英文释义词库的“壳方案”：本身不用来输入，
# 只是让 english / double_pinyin_mspy 的 dependencies 能把 en_comment 词库编译出来。

schema:
  schema_id: en_comment
  name: 英文释义词库
  version: "2026-10"
  description: 供反查滤镜使用，不用于输入。

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - table_translator

translator:
  enable_encoder: false
  encode_commit_history: false
  enable_sentence: false
  enable_completion: false
  enable_user_dict: false
  dictionary: en_comment

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
