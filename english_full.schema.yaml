# Rime schema
# encoding: utf-8
#
# 完整英文词库的“壳方案”：本身不用来输入，
# 只是让 english / double_pinyin_mspy 的 dependencies 能把完整词库 english 编译出来。

schema:
  schema_id: english_full
  name: 英文完整词库
  version: "2026-10"
  description: 供整词精确匹配使用，不用于输入。

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - table_translator

translator:
  dictionary: english
  enable_encoder: false
  encode_commit_history: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA'"
  delimiter: " "
